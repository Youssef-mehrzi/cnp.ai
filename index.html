    body {

      min-height: 100vh;

    .container {

    .title {

      font-weight: 500;

      text-align: left;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
      text-align: left;
    }
    .input-group input {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 1.5px solid #1a73e8;
      border-radius: 4px;
      outline: none;
      background: transparent;
      color: #202124;
    }
    .input-group label {
      position: absolute;
      left: 12px;
      top: -10px;
      background-color: #ffffff;
      padding: 0 4px;
      font-size: 12px;
      color: #1a73e8;
    }

    .forgot-link, .create-account {
      display: block;
      color: #1a73e8;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
      text-align: left;
      margin-bottom: 20px;
    }

    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 40px;
    }

    button {
      padding: 10px 24px;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background-color: #1557b0;
    }

    #step2Form, #step3Form, #success-message {
      display: none;
    }

      padding: 4px 12px;
      font-size: 14px;
      color: #3c4043;
      margin-bottom: 20px;
    }
